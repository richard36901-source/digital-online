<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<title>דיגיטל אונליין</title>
<script>
/* This page was renamed to whatsapp.html. Kept as a thin redirect (instead
   of deleting the file outright) so any already-sent WhatsApp links that
   still point at lp.html keep working -- the query string (marketer, p,
   etc.) is preserved on the redirect. */
location.replace('whatsapp.html' + location.search);
</script>
</head>
<body>
<p>מועבר... <a id="fallback" href="whatsapp.html">לחץ כאן אם אינך מועבר אוטומטית</a></p>
<script>document.getElementById('fallback').href = 'whatsapp.html' + location.search;</script>
</body>
</html>
