<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>מעקב מסע לקוח | דיגיטל אונליין</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0f1115;color:#e8e8e8;padding:24px;direction:rtl;}
h1{font-size:22px;margin-bottom:4px;}
.sub{color:#8a8f98;font-size:13px;margin-bottom:20px;}
.controls{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
input[type=text]{background:#1b1e26;border:1px solid #2c313d;color:#e8e8e8;padding:8px 12px;border-radius:8px;font-size:14px;min-width:220px;}
button{background:#3b6bf5;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px;}
button:hover{background:#2f57cc;}
.stat{background:#1b1e26;border:1px solid #2c313d;border-radius:10px;padding:10px 16px;font-size:13px;color:#c7cbd4;}
.stat b{color:#fff;font-size:16px;}
table{width:100%;border-collapse:collapse;background:#151821;border-radius:10px;overflow:hidden;font-size:14px;}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid #22262f;}
th{background:#1b1e26;color:#8a8f98;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px;}
tr:hover td{background:#1b1e26;}
.stage-pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;}
.s1{background:#3a2f1a;color:#e0b357;}
.s2{background:#2a3a1a;color:#a8d666;}
.s3{background:#1a3a30;color:#5fd6b0;}
.s4{background:#1a2f3a;color:#5fb3d6;}
.s5{background:#261a3a;color:#a066d6;}
.s6{background:#3a1a2a;color:#ff6ba0;font-weight:700;}
.del-btn{background:#3a1a1a;color:#ff6b6b;border:1px solid #522;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap;}
.del-btn:hover{background:#522;}
.del-btn:disabled{opacity:.5;cursor:default;}
.empty{color:#8a8f98;text-align:center;padding:40px;}
.loading{color:#8a8f98;text-align:center;padding:40px;}
</style>
</head>
<body>

<h1>מעקב מסע לקוח 🔥</h1>
<div class="sub">כל ליד + השלב הכי רחוק שהגיע אליו במסע (דף נחיתה → 4 סרטונים → הרשמה לוובינר). מתעדכן אוטומטית מכל האתר, בלי תלות ב-LeadManager.</div>

<div class="controls">
  <input type="text" id="searchBox" placeholder="חיפוש לפי טלפון / שם / אימייל..."/>
  <button onclick="loadData()">🔄 רענן</button>
  <div class="stat" id="statTotal">סה"כ: <b>-</b></div>
  <div class="stat" id="statHot">הגיעו לוובינר: <b>-</b></div>
</div>

<div id="content" class="loading">טוען...</div>

<script>
const LOOKUP_HOOK = 'https://hook.eu1.make.com/7r3efmcx10cg5a90mdjtlhxylo2a3coe';
const DELETE_HOOK = 'https://hook.eu1.make.com/roprlw5d1k90tai1bqptq9jih6w964uy';
const STAGE_LABELS = {
  1: 'דף נחיתה',
  2: 'סרטון 1',
  3: 'סרטון 2',
  4: 'סרטון 3',
  5: 'סרטון 4',
  6: '🏆 נרשם לוובינר'
};
let allRows = [];

async function loadData(){
  const content = document.getElementById('content');
  content.className = 'loading';
  content.textContent = 'טוען...';
  try {
    const res = await fetch(LOOKUP_HOOK, { cache: 'no-store' });
    const raw = await res.json();
    // Collapse to one row per phone = the highest stage reached
    const byPhone = {};
    (raw || []).forEach(r => {
      if(!r || !r.phone) return;
      const stage = Number(r.stage) || 0;
      const existing = byPhone[r.phone];
      if(!existing || stage > existing.stage || (stage === existing.stage && r.updated_at > existing.updated_at)){
        byPhone[r.phone] = { phone: r.phone, name: r.name, email: r.email, stage: stage, stage_label: r.stage_label, updated_at: r.updated_at };
      }
    });
    allRows = Object.values(byPhone).sort((a,b) => (b.updated_at || '').localeCompare(a.updated_at || ''));
    render(allRows);
  } catch(e) {
    content.textContent = 'שגיאה בטעינת הנתונים: ' + e.message;
  }
}

function render(rows){
  const content = document.getElementById('content');
  document.getElementById('statTotal').innerHTML = 'סה"כ: <b>' + rows.length + '</b>';
  document.getElementById('statHot').innerHTML = 'הגיעו לוובינר: <b>' + rows.filter(r => r.stage >= 6).length + '</b>';

  if(!rows.length){
    content.className = 'empty';
    content.textContent = 'אין נתונים עדיין.';
    return;
  }
  content.className = '';
  let html = '<table><thead><tr><th>שם</th><th>טלפון</th><th>אימייל</th><th>שלב אחרון</th><th>עודכן</th><th></th></tr></thead><tbody>';
  rows.forEach(r => {
    html += '<tr>'
      + '<td>' + esc(r.name || '-') + '</td>'
      + '<td dir="ltr" style="text-align:right">' + esc(r.phone || '-') + '</td>'
      + '<td dir="ltr" style="text-align:right">' + esc(r.email || '-') + '</td>'
      + '<td><span class="stage-pill s' + r.stage + '">' + (STAGE_LABELS[r.stage] || r.stage_label || '-') + '</span></td>'
      + '<td>' + esc(r.updated_at || '-') + '</td>'
      + '<td><button class="del-btn" data-phone="' + esc(r.phone || '') + '" onclick="deleteLead(this)">🗑️ מחק</button></td>'
      + '</tr>';
  });
  html += '</tbody></table>';
  content.innerHTML = html;
}

async function deleteLead(btn){
  const phone = btn.getAttribute('data-phone');
  if(!phone) return;
  if(!confirm('למחוק את הליד עם הטלפון ' + phone + ' מהטבלה? הפעולה אינה הפיכה.')) return;

  btn.disabled = true;
  btn.textContent = 'מוחק...';
  try {
    const res = await fetch(DELETE_HOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: phone })
    });
    if(!res.ok) throw new Error('שגיאת שרת');
    allRows = allRows.filter(r => r.phone !== phone);
    const q = document.getElementById('searchBox').value.trim().toLowerCase();
    render(!q ? allRows : allRows.filter(r =>
      (r.phone||'').toLowerCase().includes(q) ||
      (r.name||'').toLowerCase().includes(q) ||
      (r.email||'').toLowerCase().includes(q)
    ));
  } catch(e) {
    alert('מחיקה נכשלה: ' + e.message);
    btn.disabled = false;
    btn.textContent = '🗑️ מחק';
  }
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('searchBox').addEventListener('input', function(){
  const q = this.value.trim().toLowerCase();
  if(!q){ render(allRows); return; }
  render(allRows.filter(r =>
    (r.phone||'').toLowerCase().includes(q) ||
    (r.name||'').toLowerCase().includes(q) ||
    (r.email||'').toLowerCase().includes(q)
  ));
});

loadData();
</script>
</body>
</html>
