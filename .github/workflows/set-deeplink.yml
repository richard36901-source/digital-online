name: One-off - apply Instagram deep link to existing TikTok ads

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  set-deeplink:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r tiktok_ads_automation/requirements.txt

      - name: Apply deep link to existing ads
        working-directory: tiktok_ads_automation
        env:
          TIKTOK_ADS_ACCESS_TOKEN: ${{ secrets.TIKTOK_ADS_ACCESS_TOKEN }}
        run: python main.py set-deeplink
