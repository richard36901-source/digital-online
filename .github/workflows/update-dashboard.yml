name: Update god_manager dashboard

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r meta_ads_automation/requirements.txt

      - name: Generate god_manager.html
        working-directory: meta_ads_automation
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python dashboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "god_manager-bot"
          git config user.email "actions@users.noreply.github.com"
          git add meta_ads_automation/god_manager.html
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update god_manager dashboard"
            git push
          else
            echo "No changes to the dashboard, skipping commit."
          fi
