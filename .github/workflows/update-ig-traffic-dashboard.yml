name: Update Instagram traffic campaign performance dashboard

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Generate performance_dashboard.html
        working-directory: ig_traffic_campaign
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python dashboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "ig-traffic-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ig_traffic_campaign/performance_dashboard.html
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update Instagram traffic campaign dashboard"
            git push
          else
            echo "No changes to the dashboard, skipping commit."
          fi
