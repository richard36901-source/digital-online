name: CPL rotation check (every ~3 days)

on:
  schedule:
    - cron: "0 8 */3 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cpl-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r meta_ads_automation/requirements.txt

      - name: Decode base64 creative images
        run: |
          find meta_ads_automation/creative_bank -name "*.b64" | while read -r f; do
            out="${f%.b64}"
            base64 -d "$f" > "$out"
            echo "Decoded $f -> $out"
          done

      - name: Run CPL check
        working-directory: meta_ads_automation
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python cpl_check.py
